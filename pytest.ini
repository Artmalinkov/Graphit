[pytest]
# Пути к тестам
testpaths = tests

# Опции запуска
addopts =
    -v
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term
    --cov-fail-under=70

# Исключаем лишние папки из покрытия
norecursedirs =
    .venv
    .idea
    __pycache__
    data
    output
    logs

# Маркеры
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests